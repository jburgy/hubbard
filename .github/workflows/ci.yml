name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-run
      # The 4×4 literature comparisons take minutes; run them locally with plain `cargo test`.
      - run: >-
          cargo test --
          --skip fully_symmetric_ground_states_match_shi_zhang
          --skip d_wave_ground_states_match_shi_zhang
