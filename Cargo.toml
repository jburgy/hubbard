[package]
name = "hubbard"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Exact diagonalization of the Hubbard model on tilted square lattices"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
nalgebra = "0.35.0"

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true

[lints.clippy]
len_without_is_empty = "allow"
